name: ci

on:
  push:
    branches: [main]
    # Docs and the Grafana dashboard JSON don't change what runs on the VM.
    paths-ignore: ["**.md", "ops/grafana/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: UI typecheck + unit tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Unit + integration tests (Testcontainers MySQL 8.4)
        run: ./mvnw -B verify
      - name: Build the burst client
        run: ./mvnw -B -q -f loadtest/pom.xml package
      - name: Clean-checkout smoke test (docker compose, exactly as a reviewer would)
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS localhost:8080/health/ready && break; sleep 2; done
          ./burst.sh http://localhost:8080 --stampede 3000 --buyers-per-hot-seat 200
      - name: UI end-to-end (Playwright, two browsers racing for one seat, checkout, rush)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --tail 200

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/seat-reservation" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 + arm64 (the Oracle VM is arm64) and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Enabled once the VM exists: repo variable DEPLOY_ENABLED=true plus
    # secrets VM_HOST and VM_SSH_KEY.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Roll the VM to this commit (rolls back by itself if not ready)
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@$VM_HOST" \
            "echo $GHCR_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null && /opt/seats/deploy/deploy.sh ${{ github.sha }}"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Smoke burst against the live URL
        run: ./burst.sh "${{ vars.LIVE_URL || 'https://seats.amogh.cloud' }}" --stampede 3000 --buyers-per-hot-seat 200

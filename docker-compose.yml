# A clean checkout runs exactly like production:
#   docker compose up --build          -> API on http://localhost:8080
#   docker compose --profile obs up    -> plus Prometheus :9090 and Grafana :3000
# Production layers deploy/docker-compose.prod.yml on top of this file.
name: seats

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: seats
      MYSQL_USER: seats
      MYSQL_PASSWORD: ${DB_PASSWORD:-seats}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-only}
    # Server settings as flags, not a mounted my.cnf: MySQL silently ignores a
    # world-writable config file, and that's what a bind mount from a Windows
    # or macOS checkout looks like inside the container.
    command:
      # The app also sets this per connection; server-wide keeps ad-hoc sessions consistent.
      - --transaction-isolation=READ-COMMITTED
      # Hikari holds a fixed pool (30); leave headroom for exporters and humans.
      - --max-connections=300
      # Durable commits: a confirmed seat survives a crash.
      - --innodb-flush-log-at-trx-commit=1
      - --innodb-redo-log-capacity=1G
      # Lock waits here are milliseconds; anything near 10s is a bug, and the app retries.
      - --innodb-lock-wait-timeout=10
      # Single node, no replicas: the binlog would only add a second fsync per commit.
      # A deployment with replicas or point-in-time recovery keeps it on.
      - --disable-log-bin
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-512M}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP ping only succeeds once the real server is up (init runs socket-only).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: ${APP_IMAGE:-seat-reservation:local}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/seats
      DB_USER: seats
      DB_PASSWORD: ${DB_PASSWORD:-seats}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      ADMIN_SECRET: ${ADMIN_SECRET:-demo-admin-secret}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    restart: unless-stopped

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/seat-reservation.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mysql-data:
